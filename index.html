<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرصد — منصة تقييم موثوقية الأعمال</title>
    <meta name="description" content="مرصد منصة سعودية لتقييم موثوقية الشركات في التعاملات بين الأعمال. مؤشر ثقة مبني على السجلات الرسمية وتجارب المجتمع التجاري وتحليل المنصة.">
    <meta name="theme-color" content="#1E2A52">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <!-- Non-blocking. This stylesheet was render-blocking for 240 ms: the browser
         will not paint until it has fetched and parsed it, and a font is not worth
         a blank screen. media="print" makes it a low-priority fetch, and onload
         switches it back to all once it has arrived. The noscript copy keeps it
         working where scripts are off. -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
    </noscript>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
